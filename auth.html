<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Ingresar</h1>
      <form data-auth-form data-mode="login">
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Contraseña<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="auth-status" role="status"></p>
      <p>¿No tenés cuenta? <a href="#" id="show-register">Registrate</a></p>
    </section>
  </main>
  <script>
    document.getElementById('show-register').addEventListener('click', function (event) {
      event.preventDefault();
      const form = document.querySelector('[data-auth-form]');
      const title = document.querySelector('h1');
      const button = form.querySelector('button');
      const register = form.dataset.mode !== 'register';
      form.dataset.mode = register ? 'register' : 'login';
      title.textContent = register ? 'Crear cuenta' : 'Ingresar';
      button.textContent = register ? 'Registrarme' : 'Iniciar sesión';
      this.textContent = register ? 'Ya tengo una cuenta' : 'Registrate';
    });
  </script>
</body>
